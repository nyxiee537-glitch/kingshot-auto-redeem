name: 537 Gift Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingshot-537-giftbot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight monitor dependencies
        run: pip install --disable-pip-version-check -q requests beautifulsoup4

      - name: Lightweight gift-code check
        id: quick_check
        run: python quick_check.py

      - name: No new gift codes
        if: steps.quick_check.outputs.should_run == 'false'
        run: echo "新しいギフトコードなし。重い交換処理をスキップします。"

      - name: Install redemption dependencies
        if: steps.quick_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Sync latest repository state
        if: steps.quick_check.outputs.should_run == 'true'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Claim new gift codes
        if: steps.quick_check.outputs.should_run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
        run: python check_codes.py --claim

      - name: Persist claimed state
        if: steps.quick_check.outputs.should_run == 'true'
        run: |
          if [[ -z "$(git status --porcelain -- seen_codes.json)" ]]; then
            echo "seen_codes.json に変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_codes.json
          git commit -m "chore: claim gift codes"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Redeem claimed gift codes
        if: steps.quick_check.outputs.should_run == 'true'
        env:
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
          DRY_RUN: "false"
        run: python check_codes.py --redeem-pending

      - name: Persist final state
        if: ${{ always() && steps.quick_check.outputs.should_run == 'true' }}
        run: |
          if [[ -z "$(git status --porcelain -- seen_codes.json)" ]]; then
            echo "seen_codes.json に変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_codes.json
          git commit -m "chore: finalize gift code state"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload redeem results
        if: ${{ always() && steps.quick_check.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: redeem-results-${{ github.run_number }}
          path: |
            redeem-results/
            redeem-summary.txt
            redeem-summary.json
          if-no-files-found: ignore
          retention-days: 14
