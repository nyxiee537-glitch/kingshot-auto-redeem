name: 537 Gift Bot

on:
  schedule:
    # 15分ごと。毎時00分の混雑を避けるため7分ずらしています。
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingshot-537-giftbot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check sources and redeem
        env:
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: "false"
        run: python check_codes.py

      - name: Persist seen codes
        if: always()
        run: |
          if git diff --quiet -- seen_codes.json; then
            echo "seen_codes.json に変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_codes.json
          git commit -m "chore: update seen gift codes"
          git pull --rebase
          git push

      - name: Upload redeem results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redeem-results-${{ github.run_number }}
          path: |
            redeem-results/
            redeem-summary.txt
            redeem-summary.json
          if-no-files-found: ignore
          retention-days: 14
