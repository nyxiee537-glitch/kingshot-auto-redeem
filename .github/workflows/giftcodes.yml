        if: steps.quick_check.outputs.should_run == 'true'
        run: |
          if [[ -z "$(git status --porcelain -- seen_codes.json)" ]]; then
            echo "seen_codes.json に変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_codes.json
          git commit -m "chore: claim gift codes"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Redeem claimed gift codes
        if: steps.quick_check.outputs.should_run == 'true'
        env:
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
          DRY_RUN: "false"
        run: python check_codes.py --redeem-pending

      - name: Persist final state
        if: ${{ always() && steps.quick_check.outputs.should_run == 'true' }}
        run: |
          if [[ -z "$(git status --porcelain -- seen_codes.json)" ]]; then
            echo "seen_codes.json に変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_codes.json
          git commit -m "chore: finalize gift code state"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload redeem results
        if: ${{ always() && steps.quick_check.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: redeem-results-${{ github.run_number }}
          path: |
            redeem-results/
            redeem-summary.txt
            redeem-summary.json
          if-no-files-found: ignore
          retention-days: 14
